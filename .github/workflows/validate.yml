name: Validate WordAtlas
# PR validation includes session lifecycle and notification preference checks.
# Security rules and account lifecycle are validated as part of the same job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check words.js
          node --check auth.js
          node --check enhancements.js
          node --check workspace.js
          node --check admin.js
          node --check functions/index.js

      - name: Test Firestore security rules in the Emulator
        run: |
          npm install --prefix tests/firestore --no-audit --no-fund
          npm --prefix tests/firestore run test:rules

      - name: Validate page structure and required UI hooks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          const required = [
            'publicLanding','landingLoginButton','landingFeatures','landingFaq','landingContact',
            'memberApp','memberDashboard','dashboardNav','dictionaryNav','profileOpen',
            'profilePage','profileEditForm','authOverlay','googleSignInButton','authStatus',
            'savedWordsGrid','vocabularyListsGrid','flashcardStage','workspaceHistoryList',
            'workspaceNotificationsList','workspacePreferencesForm','supportTicketForm',
            'adminApp','adminUsersTable','adminAuditList','topicBrowser','loadMoreButton'
          ];
          const missing = required.filter(id => !ids.includes(id));
          if (missing.length) throw new Error('Missing UI hooks: ' + missing.join(', '));
          for (const [file, marker] of [
            ['firebase-config.js','WORDATLAS_FIREBASE_CONFIG'],
            ['auth.js','onAuthStateChanged'],
            ['workspace.js','WordAtlasWorkspace'],
            ['admin.js','WordAtlasAdmin']
          ]) {
            if (!fs.existsSync(file) || !fs.readFileSync(file,'utf8').includes(marker)) {
              throw new Error('Missing or incomplete file: ' + file);
            }
          }
          if (!html.includes('linkedin.com/in/ahmed-khaledai/')) throw new Error('LinkedIn URL is not current.');
          console.log('Page IDs, required screens and public creator links are valid.');
          NODE

      - name: Validate local dictionary catalog
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('words.js', 'utf8');
          const categories = [...source.matchAll(/wikiCategory:\s*"([^"]+)"/g)].map(match => match[1]);
          if (categories.length !== 23) throw new Error('Expected 23 topic categories, found ' + categories.length);
          const rows = [...source.matchAll(/^\s*\["([^"]+)",\s*"([^"]+)",\s*"(noun|verb|adjective)",\s*"([^"]+)"\]/gm)];
          if (rows.length < 80) throw new Error('Starter vocabulary appears incomplete: ' + rows.length + ' rows.');
          const ids = new Set();
          for (const row of rows) {
            const id = row[1].trim().toLowerCase();
            if (!row[2].trim() || ids.has(id)) throw new Error('Empty translation or duplicate vocabulary item: ' + row[1]);
            ids.add(id);
          }
          console.log('Verified 23 topic categories and ' + rows.length + ' curated vocabulary rows locally.');
          NODE

      - name: Validate authentication, privacy and account permissions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html','utf8');
          const auth = fs.readFileSync('auth.js','utf8');
          const rules = fs.readFileSync('firestore.rules','utf8');
          const functions = fs.readFileSync('functions/index.js','utf8');
          const checks = [
            ['public landing is available', /id="publicLanding"/.test(html)],
            ['member app is hidden by default', /id="memberApp"[^>]*hidden/.test(html)],
            ['private scripts are not eagerly loaded', !/<script\b[^>]*src="(?:words|app|workspace|admin)\.js"/.test(html)],
            ['Firebase Auth state controls the session', auth.includes('onAuthStateChanged')],
            ['profile status callback uses the defined function', auth.includes('setProfileStatus("جارٍ تجهيز حسابك') && !auth.includes('profileStatus(')],
            ['Firestore profile uses the authenticated UID', auth.includes('doc(db,"users",user.uid)') && auth.includes('setDoc(ref,values,{merge:true})')],
            ['member scripts load after authentication', auth.includes('loadScript("words.js")') && auth.includes('onAuthStateChanged')],
            ['Admin route checks trusted role claims', auth.includes('route==="admin"') && auth.includes('["admin","super_admin","support","moderator"].includes(role)')],
            ['Firestore profiles are owner-scoped', rules.includes('match /users/{uid}') && rules.includes('request.auth.uid == uid')],
            ['private collections are scoped to owner', rules.includes('match /private_data/{documentId}') && rules.includes('allow read, write: if false')],
            ['admin roles come from trusted server claims', rules.includes('request.auth.token.role') && functions.includes('setCustomUserClaims')],
            ['LinkedIn profile link is updated', html.includes('linkedin.com/in/ahmed-khaledai/')]
          ];
          for (const [name, ok] of checks) console.log((ok ? 'PASS ' : 'FAIL ') + name);
          const failed = checks.filter(([,ok]) => !ok);
          if (failed.length) throw new Error('Security/access checks failed: ' + failed.map(([name]) => name).join(', '));
          NODE

      - name: Validate trusted Admin backend and account workspace
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const workspace=fs.readFileSync('workspace.js','utf8');
          const admin=fs.readFileSync('admin.js','utf8');
          const auth=fs.readFileSync('auth.js','utf8');
          const rules=fs.readFileSync('firestore.rules','utf8');
          const functions=fs.readFileSync('functions/index.js','utf8');
          const checks = [
            ['personal saved words', html.includes('id="savedWordsGrid"') && workspace.includes('wordatlas-favorites')],
            ['personal vocabulary lists', workspace.includes('vocabulary_lists')],
            ['flashcards', html.includes('id="flashcardStage"') && workspace.includes('flashcard_reviewed')],
            ['search history', workspace.includes('search_history')],
            ['personal preferences', workspace.includes('privateRef("preferences")')],
            ['support and feedback', workspace.includes('support_tickets') && workspace.includes('user_feedback')],
            ['admin user management', admin.includes('adminListUsers') && admin.includes('adminSetUserRole')],
            ['admin audit trail', admin.includes('audit_logs') && functions.includes('async function audit')],
            ['owner-only Super Admin bootstrap', functions.includes('bootstrapOwnerAdmin') && functions.includes('email_verified')],
            ['server-side admin authorization compares current custom claims and profile role', functions.includes('async function requireAdmin') && functions.includes('account.customClaims?.role') && functions.includes('profileRole!==role') && functions.includes('Backfill role for an existing trusted Admin account')],
            ['disabled accounts are rejected by trusted callables', functions.includes('if(user.disabled)throw new HttpsError')],
            ['Admin role changes revoke old refresh tokens and tracked sessions', functions.includes('Role assigned and existing sessions revoked:') && functions.includes('markTrackedSessionsInactive(uid,"role_changed")')],
            ['account suspension disables and closes tracked sessions', functions.includes('markTrackedSessionsInactive(uid,"account_suspended")') && functions.includes('auth.updateUser(uid,{disabled})')],
            ['new users can create profiles before role claims exist', rules.includes('function isOwner(uid)') && rules.includes('return isActiveUser() && request.auth.uid == uid;') && tests.includes('profile creation remains possible')],
            ['Admin rules require an existing profile with a matching role', rules.includes('&& exists(/databases/$(database)/documents/users/$(request.auth.uid))') && rules.includes("== request.auth.token.get('role', 'user')")],
            ['Firestore rules require current role and active account', rules.includes('function hasCurrentRole()') && rules.includes("data.get('role', 'user')") && rules.includes('function isActiveUser()')],
            ['Emulator tests cover stale role claims and suspended users', tests.includes('staleRoleDb') && tests.includes('suspended users cannot use member-only collections')],
            ['server-side rate limiting', functions.includes('async function rateLimit')],
            ['tracked browser sessions are UID-scoped', functions.includes('exports.recordAppSession') && functions.includes('exports.listOwnSessions') && functions.includes('exports.endOwnSession')],
            ['session revocation marks tracked sessions inactive', functions.includes('exports.revokeOwnSessions') && functions.includes('active_sessions')],
            ['revoked tokens cannot reopen a tracked session', functions.includes('async function requireFreshUser') && functions.includes('const caller=await requireFreshUser(request);')],
            ['stale browser sessions expire from active inventory', functions.includes('Date.now()-35*60*1000') && auth.includes('10*60*1000')],
            ['account deletion removes related session and activity records', functions.includes('"active_sessions","analytics_events"')],
            ['published announcements appear in the member workspace', html.includes('id="platformAnnouncementsList"') && workspace.includes('public_announcements')],
            ['security page shows session inventory', html.includes('id="activeSessionsList"') && workspace.includes('listOwnSessions')],
            ['tracked sessions cannot be read from browser Firestore', rules.includes('match /active_sessions/{sessionId}') && rules.includes('allow read, write: if false')],
            ['new-browser security notifications respect preferences', functions.includes('settings.securityNotifications!==false') && functions.includes('settings.inAppNotifications!==false')],
            ['Admin dashboard performs a real health check', admin.includes('adminGetSystemHealth')],
            ['admin analytics chart containers exist', html.includes('id="adminUsageChart"') && html.includes('id="adminFeatureUsage"')],
            ['search analytics records no query text', functions.includes('exports.recordUserSearch') && functions.includes('track(caller.uid,"search_performed")') && !functions.slice(functions.indexOf('exports.recordUserSearch'),functions.indexOf('exports.recordUserSearch')+500).includes('request.data?.query')],
            ['admin usage dashboard aggregates bounded events', functions.includes('analytics_events").where("createdAt",">=",cutoff)') && functions.includes('dailyActivity') && functions.includes('topFeatures')],
            ['workspace reports searches without sending the search term', workspace.includes('session.callFunction("recordUserSearch")') && !workspace.includes('session.callFunction("recordUserSearch",{query:term')],
            ['last private sync cannot block sign-out', auth.includes('let syncFailed=false') && auth.includes('closeBackendSession()')],
            ['email marketing consent is not presented as active email delivery', html.includes('إرسال البريد الإلكتروني غير مفعّل')],
            ['no committed service credentials', !functions.includes('private_key') && !functions.includes('serviceAccount')]
          ];
          for (const [name,ok] of checks) console.log((ok ? 'PASS ' : 'FAIL ') + name);
          const failed=checks.filter(([,ok])=>!ok);
          if(failed.length) throw new Error('Workspace/Admin checks failed: '+failed.map(([name])=>name).join(', '));
          NODE
