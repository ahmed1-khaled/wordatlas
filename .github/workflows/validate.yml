name: Validate WordAtlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check words.js
          node --check auth.js
          node --check enhancements.js
      - name: Check required UI hooks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'topicBrowser', 'topicSummary', 'topicBreadcrumbs', 'subCategoryList',
            'loadMoreWrap', 'loadMoreButton', 'translatePageButton',
            'authTrigger', 'accountButton', 'accountMenu', 'authOverlay',
            'googleSignInButton', 'authStatus', 'themeToggle',
            'readingProgressBar', 'closeAuthButton', 'signOutButton'
          ];
          const missing = required.filter(id => !html.includes(`id="${id}"`));
          if (missing.length) throw new Error('Missing UI hooks: ' + missing.join(', '));

          for (const file of ['firebase-config.js', 'auth.js', 'enhancements.js']) {
            if (!fs.existsSync(file)) throw new Error('Missing required file: ' + file);
          }
          const config = fs.readFileSync('firebase-config.js', 'utf8');
          if (!config.includes('WORDATLAS_FIREBASE_CONFIG')) throw new Error('Firebase config placeholder is missing.');
          if (!html.includes('https://github.com/ahmed1-khaled')) throw new Error('Creator GitHub link is missing.');
          if (!html.includes('https://www.linkedin.com/in/a7med-khaled/')) throw new Error('Creator LinkedIn link is missing.');
          console.log('Topic browser, Google sign-in, theme and creator profile UI hooks are present.');
          NODE
      - name: Verify live Wiktionary topic categories
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('words.js', 'utf8');
          const categories = [...source.matchAll(/wikiCategory:\s*"([^"]+)"/g)].map(match => match[1]);
          if (categories.length !== 23) throw new Error(`Expected 23 topics, found ${categories.length}`);
          const params = new URLSearchParams({
            action: 'query',
            prop: 'categoryinfo',
            titles: categories.map(name => `Category:en:${name}`).join('|'),
            format: 'json',
            formatversion: '2',
            origin: '*'
          });
          const response = await fetch('https://en.wiktionary.org/w/api.php?' + params);
          if (!response.ok) throw new Error('Wiktionary category check failed: HTTP ' + response.status);
          const data = await response.json();
          const pages = Array.isArray(data.query?.pages) ? data.query.pages : [];
          const available = new Set(pages.filter(page => !page.missing && page.categoryinfo).map(page => page.title));
          const missing = categories.filter(name => !available.has(`Category:en:${name}`));
          if (missing.length) throw new Error('Wiktionary categories missing: ' + missing.join(', '));
          const sample = new URLSearchParams({
            action: 'query',
            list: 'categorymembers',
            cmtitle: 'Category:en:Computing',
            cmtype: 'page',
            cmlimit: '5',
            format: 'json',
            formatversion: '2',
            origin: '*'
          });
          const sampleResponse = await fetch('https://en.wiktionary.org/w/api.php?' + sample);
          const sampleData = await sampleResponse.json();
          if (!sampleResponse.ok || !sampleData.query?.categorymembers?.length) {
            throw new Error('Wiktionary category page listing returned no results.');
          }
          const firstPageIds = new Set(sampleData.query.categorymembers.map(page => page.pageid));
          const continuation = sampleData.continue?.cmcontinue;
          if (!continuation) throw new Error('Expected a continuation token for the Computing category.');
          sample.set('cmcontinue', continuation);
          const nextResponse = await fetch('https://en.wiktionary.org/w/api.php?' + sample);
          const nextData = await nextResponse.json();
          if (!nextResponse.ok || !nextData.query?.categorymembers?.length) {
            throw new Error('Wiktionary category continuation returned no results.');
          }
          if (nextData.query.categorymembers.some(page => firstPageIds.has(page.pageid))) {
            throw new Error('Wiktionary pagination returned duplicate pages.');
          }
          const subcats = new URLSearchParams({
            action: 'query',
            list: 'categorymembers',
            cmtitle: 'Category:en:Computing',
            cmtype: 'subcat',
            cmlimit: '5',
            format: 'json',
            formatversion: '2',
            origin: '*'
          });
          const subResponse = await fetch('https://en.wiktionary.org/w/api.php?' + subcats);
          const subData = await subResponse.json();
          if (!subResponse.ok || !subData.query?.categorymembers?.length) {
            throw new Error('Wiktionary subcategory list returned no results.');
          }
          console.log(`Verified ${categories.length} topic categories, Computing entries, subcategories and pagination.`);
          NODE
      - name: Check public access gate and private profile rules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const auth = fs.readFileSync('auth.js', 'utf8');
          const rules = fs.readFileSync('firestore.rules', 'utf8');
          const checks = [
            ['public landing', html.includes('id="publicLanding"')],
            ['member app starts hidden', /id="memberApp" hidden/.test(html)],
            ['profile screen', html.includes('id="profilePage"')],
            ['Google landing action', html.includes('id="landingLoginButton"')],
            ['protected scripts are not eagerly loaded', !html.includes('<script src="words.js"></script>') && !html.includes('<script src="app.js"></script>')],
            ['protected scripts load only after authentication', auth.includes('async function loadProtectedApp') && auth.includes('onAuthStateChanged')],
            ['Firestore stores the user UID profile', auth.includes('doc(db, "users", user.uid)') && auth.includes('setDoc(profileRef')],
            ['Firestore rules scope a profile to its owner', rules.includes('match /users/{userId}') && rules.includes('request.auth.uid == userId')],
            ['LinkedIn URL is updated', html.includes('linkedin.com/in/ahmed-khaledai/')]
          ];
          const failed = checks.filter(([, ok]) => !ok);
          for (const [label, ok] of checks) console.log((ok ? 'PASS ' : 'FAIL ') + label);
          if (failed.length) throw new Error('WordAtlas access/profile checks failed: ' + failed.map(([label]) => label).join(', '));
          NODE
